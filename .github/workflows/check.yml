name: check

on:
  push:
    branches-ignore:
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-prod-stack

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      AWS_REGION: ap-northeast-1
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
      - name: Install Serverless Framework
        run: npm install -g serverless@^3
      - name: Delete orphaned Lambda log group
        # The CloudWatch log group /aws/lambda/<fn> is auto-created by Lambda on
        # invoke and can outlive `sls remove`, leaving an orphan. CloudFormation's
        # AWS::EarlyValidation::ResourceExistenceCheck then rejects the deploy
        # ("Resource of type 'AWS::Logs::LogGroup' ... already exists"). Delete it
        # so the stack can create it cleanly.
        run: aws logs delete-log-group --log-group-name /aws/lambda/docker-selenium-lambda-prod-demo 2>/dev/null || true
      - name: Deploy
        run: sls deploy
      - name: Invoke
        run: sls invoke --function demo |& tee /tmp/scraping-result.txt
      - name: Check
        run: cat /tmp/scraping-result.txt | grep -q "This domain is for use in documentation examples"
      - name: Clean up (ECR costs)
        run: sls remove
